[package]
name = "instrument-scpi-package-consumer"
version = "0.2.0-alpha.1"
edition = "2021"
publish = false
[workspace]
[dependencies]
instrument-components="=0.2.0-alpha.1"
instrument-api = "=0.2.0-alpha.1"
instrument-runtime = "=0.2.0-alpha.1"
instrument-scpi = "=0.2.0-alpha.1"
instrument-testkit = "=0.2.0-alpha.1"
tokio = { version = "1", features = ["rt", "macros"], optional = true }
[features]
default = []
async = ["instrument-components/async","instrument-api/async", "instrument-runtime/async", "instrument-scpi/async", "instrument-testkit/async", "dep:tokio"]
