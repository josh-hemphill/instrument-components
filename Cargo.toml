[workspace]
resolver = "2"
members = [
    "crates/instrument-core",
    "crates/instrument-visa",
    "crates/instrument",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/josh-hemphill/instrument-components"
homepage = "https://josh-hemphill.github.io/instrument-components/"
readme = "README.md"
keywords = ["visa", "scpi", "instrument", "ni-visa", "gpib"]
categories = ["science", "hardware-support", "api-bindings"]
rust-version = "1.70"

[workspace.dependencies]
instrument-core = { path = "crates/instrument-core", version = "0.1.0" }
instrument-visa = { path = "crates/instrument-visa", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["io-util", "time", "sync", "rt"] }
visa-rs = { version = "0.7.0-alpha.1", default-features = false }
