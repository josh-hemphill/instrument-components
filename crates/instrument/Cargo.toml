[package]
name = "instrument-components"
version = "0.2.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Protocol-neutral instrument catalog and explicit build-time driver composition"
repository = "https://github.com/josh-hemphill/instrument-components"
readme = "../../README.md"
[lib]
name = "instrument"
[dependencies]
instrument-api = { path = "../instrument-api", version = "=0.2.0-alpha.1" }
instrument-runtime = { path = "../instrument-runtime", version = "=0.2.0-alpha.1" }
[features]
default = []
async = ["instrument-api/async", "instrument-runtime/async"]
[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
