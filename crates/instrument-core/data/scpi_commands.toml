# SCPI command templates — single source for Rust + C# codegen.
# Placeholders use {name}. Optional args use kind-specific helpers in generators.
# Regenerate: node tools/gen-shared-tables.ts

[const]
fgen_read_frequency = ":SOUR:FREQ?"
scope_read_timebase_scale = ":TIMebase:SCALe?"
scope_run = ":RUN"
scope_stop = ":STOP"
scope_single = ":SINGle"
scope_waveform_format_ascii = ":WAVeform:FORMat ASCii"
scope_waveform_preamble = ":WAVeform:PREamble?"
scope_waveform_data = ":WAVeform:DATA?"
switch_open_all = ":ROUTe:OPEN:ALL"
counter_measure_frequency = ":MEASure:FREQuency?"
counter_measure_period = ":MEASure:PERiod?"
counter_reset_totalize = ":COUNter:CRESet"
counter_read_totalize = ":COUNter:DATA?"
dmm_initiate = "INIT"
dmm_fetch = "FETC?"
dmm_read = "READ?"
dmm_software_trigger = "*TRG"
pwrmeter_initiate = "INIT"
pwrmeter_fetch = "FETC?"
pwrmeter_read = "READ?"
pwrmeter_configure = ":CONF"
specan_marker_peak = ":CALC:MARK:MAX"
specan_marker_x = ":CALC:MARK:X?"
specan_marker_y = ":CALC:MARK:Y?"
specan_single_sweep = ":INIT:IMM"
specan_wait_opc = "*OPC?"
specan_trace_data = ":TRAC:DATA? TRACE1"

[optional_range]
dmm_measure_voltage_dc = ":MEAS:VOLT:DC?"
dmm_measure_voltage_ac = ":MEAS:VOLT:AC?"
dmm_measure_current_dc = ":MEAS:CURR:DC?"
dmm_measure_current_ac = ":MEAS:CURR:AC?"
dmm_measure_resistance = ":MEAS:RES?"
dmm_measure_resistance_2wire = ":MEAS:RES?"
dmm_measure_resistance_4wire = ":MEAS:FRES?"
dmm_measure_temperature = ":MEAS:TEMP?"

[template]
psu_set_voltage = ":SOUR{channel}:VOLT {volts}"
psu_set_current_limit = ":SOUR{channel}:CURR {amps}"
psu_output_enable = ":OUTP{channel} {state}"
psu_output_state_query = ":OUTP{channel}?"
psu_read_voltage = ":MEAS:VOLT? {channel}"
psu_read_current = ":MEAS:CURR? {channel}"
psu_ovp_level = ":SOUR{channel}:VOLT:PROT {volts}"
psu_ovp_enable = ":SOUR{channel}:VOLT:PROT:STAT {state}"
psu_ovp_query = ":SOUR{channel}:VOLT:PROT:STAT?"
psu_sense_enable = ":OUTP{channel}:SENS {state}"
fgen_set_waveform = ":SOUR:FUNC {scpi_name}"
fgen_set_frequency = ":SOUR:FREQ {hz}"
fgen_set_amplitude = ":SOUR:VOLT {vpp}"
fgen_set_offset = ":SOUR:VOLT:OFFS {volts}"
fgen_set_duty_cycle = ":SOUR:FUNC:SQU:DCYC {percent}"
fgen_set_load = ":OUTP:LOAD {ohms}"
fgen_output_enable = ":OUTP {state}"
fgen_burst_count = ":SOUR:BURS:NCYC {count}"
fgen_burst_state = ":SOUR:BURS:STAT {state}"
fgen_burst_trigger = ":TRIG:SOUR {source}"
scope_set_timebase_scale = ":TIMebase:SCALe {seconds_per_div}"
scope_set_channel_scale = ":CHANnel{channel}:SCALe {volts_per_div}"
scope_channel_display = ":CHANnel{channel}:DISP {state}"
scope_channel_coupling = ":CHANnel{channel}:COUP {coupling}"
scope_trigger_source = ":TRIGger:EDGE:SOURce {source}"
scope_trigger_level = ":TRIGger:EDGE:LEVel {volts}"
scope_trigger_slope = ":TRIGger:EDGE:SLOPe {slope}"
scope_measure_vpp = ":MEASure:VPP? CHAN{channel}"
scope_measure_frequency = ":MEASure:FREQuency? CHAN{channel}"
scope_set_waveform_source = ":WAVeform:SOURce CHAN{channel}"
switch_close_route = ":ROUTe:CLOS (@({ch1},{ch2}))"
switch_open_route = ":ROUTe:OPEN (@({ch1},{ch2}))"
switch_is_closed = ":ROUTe:CLOS? (@({ch1},{ch2}))"
counter_gate_time = ":SENSe:FREQuency:APERture {seconds}"
counter_channel_select = ":SENSe:FUNCtion:ON \"FREQ {channel}\""
pwrmeter_unit = ":UNIT:POW {unit}"
pwrmeter_auto_range = ":SENS:POW:RANG:AUTO {state}"
pwrmeter_auto_average = ":SENS:AVER:COUN:AUTO {state}"
pwrmeter_correction_frequency = ":SENS:FREQ {hz}"
pwrmeter_offset = ":SENS:CORR:GAIN2 {db}"
specan_center_frequency = ":FREQ:CENT {hz}"
specan_span = ":FREQ:SPAN {hz}"
specan_rbw = ":BAND {hz}"
specan_vbw = ":BAND:VID {hz}"
specan_ref_level = ":DISP:WIND:TRAC:Y:RLEV {dbm}"
specan_sweep_continuous = ":INIT:CONT {state}"

# Special: configure helpers have four variants (handled in generator)
[dmm_configure_voltage_dc]
base = ":CONF:VOLT:DC"
with_range_resolution = ":CONF:VOLT:DC {range},{resolution}"
with_range = ":CONF:VOLT:DC {range}"
with_resolution = ":CONF:VOLT:DC DEF,{resolution}"

[dmm_configure_voltage_ac]
base = ":CONF:VOLT:AC"
with_range_resolution = ":CONF:VOLT:AC {range},{resolution}"
with_range = ":CONF:VOLT:AC {range}"
with_resolution = ":CONF:VOLT:AC DEF,{resolution}"

[dmm_configure_current_dc]
base = ":CONF:CURR:DC"
with_range_resolution = ":CONF:CURR:DC {range},{resolution}"
with_range = ":CONF:CURR:DC {range}"
with_resolution = ":CONF:CURR:DC DEF,{resolution}"

[dmm_configure_current_ac]
base = ":CONF:CURR:AC"
with_range_resolution = ":CONF:CURR:AC {range},{resolution}"
with_range = ":CONF:CURR:AC {range}"
with_resolution = ":CONF:CURR:AC DEF,{resolution}"

[dmm_configure_resistance]
base = ":CONF:RES"
with_range_resolution = ":CONF:RES {range},{resolution}"
with_range = ":CONF:RES {range}"
with_resolution = ":CONF:RES DEF,{resolution}"

[dmm_configure_resistance_4wire]
base = ":CONF:FRES"
with_range_resolution = ":CONF:FRES {range},{resolution}"
with_range = ":CONF:FRES {range}"
with_resolution = ":CONF:FRES DEF,{resolution}"
