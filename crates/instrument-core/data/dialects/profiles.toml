# Dialect profiles — vendor SCPI variance contained in static specs.
# Regenerate: node tools/gen-dialects.ts
#
# Matching: first profile whose kind matches and manufacturer/model globs match IDN
# (case-insensitive; `*` wildcard). Profiles are ordered; put specific dialects
# before catch-all `generic_*` entries.
#
# `ci_*_dialect_wins` rows are CI fixtures (fake IDN `TestDialect*`), not hardware
# vendors. Real DMM/PSU vendor profiles live under `spec/vendors/` and are merged
# by the generator before `generic_*`.

[[profile]]
id = "ci_dmm_dialect_wins"
kind = "Dmm"
manufacturer_glob = "TestDialect*"
model_glob = "*"
channels = 1

[profile.commands]
measure_voltage_dc = ":MEAS:VOLT:DC:TEST?"
configure_voltage_dc = ":CONF:VOLT:DC {range}"
read = ":FETC{channel}?"

[[profile]]
id = "ci_psu_dialect_wins"
kind = "DcPowerSupply"
manufacturer_glob = "TestDialect*"
model_glob = "*"
channels = 1

[profile.commands]
set_voltage = ":VOLT {volts},(@{channel})"

[[profile]]
id = "generic_dmm"
kind = "Dmm"
manufacturer_glob = "*"
model_glob = "*"
channels = 1

[profile.commands]
measure_voltage_dc = ":MEAS:VOLT:DC?"
measure_voltage_ac = ":MEAS:VOLT:AC?"
measure_current_dc = ":MEAS:CURR:DC?"
measure_current_ac = ":MEAS:CURR:AC?"
measure_resistance_2w = ":MEAS:RES?"
measure_resistance_4w = ":MEAS:FRES?"
measure_temperature = ":MEAS:TEMP?"
configure_voltage_dc = ":CONF:VOLT:DC"
initiate = "INIT"
fetch = "FETC?"
read = "READ?"
software_trigger = "*TRG"

[[profile]]
id = "generic_dcpwr"
kind = "DcPowerSupply"
manufacturer_glob = "*"
model_glob = "*"
channels = 1

[profile.commands]
set_voltage = ":SOUR{channel}:VOLT {volts}"
set_current_limit = ":SOUR{channel}:CURR {amps}"
output_enable = ":OUTP{channel} {state}"
output_state_query = ":OUTP{channel}?"
read_voltage = ":MEAS:VOLT? {channel}"
read_current = ":MEAS:CURR? {channel}"
ovp_level = ":SOUR{channel}:VOLT:PROT {volts}"
ovp_enable = ":SOUR{channel}:VOLT:PROT:STAT {state}"
ovp_query = ":SOUR{channel}:VOLT:PROT:STAT?"
sense_enable = ":OUTP{channel}:SENS {state}"

[[profile]]
id = "generic_fgen"
kind = "FunctionGenerator"
manufacturer_glob = "*"
model_glob = "*"
channels = 1

[profile.commands]
set_waveform = ":SOUR:FUNC {scpi_name}"
set_frequency = ":SOUR:FREQ {hz}"
set_amplitude = ":SOUR:VOLT {vpp}"
set_offset = ":SOUR:VOLT:OFFS {volts}"
set_duty_cycle = ":SOUR:FUNC:SQU:DCYC {percent}"
set_load = ":OUTP:LOAD {ohms}"
output_enable = ":OUTP {state}"
burst_count = ":SOUR:BURS:NCYC {count}"
burst_state = ":SOUR:BURS:STAT {state}"
burst_trigger = ":TRIG:SOUR {source}"

[[profile]]
id = "generic_scope"
kind = "Oscilloscope"
manufacturer_glob = "*"
model_glob = "*"
channels = 4

[profile.commands]
set_timebase_scale = ":TIMebase:SCALe {seconds_per_div}"
set_channel_scale = ":CHANnel{channel}:SCALe {volts_per_div}"
channel_display = ":CHANnel{channel}:DISP {state}"
channel_coupling = ":CHANnel{channel}:COUP {coupling}"
trigger_source = ":TRIGger:EDGE:SOURce {source}"
trigger_level = ":TRIGger:EDGE:LEVel {volts}"
trigger_slope = ":TRIGger:EDGE:SLOPe {slope}"
single = ":SINGle"
run = ":RUN"
stop = ":STOP"
measure_vpp = ":MEASure:VPP? CHAN{channel}"
measure_frequency = ":MEASure:FREQuency? CHAN{channel}"
waveform_source = ":WAVeform:SOURce CHAN{channel}"
waveform_format_ascii = ":WAVeform:FORMat ASCii"
waveform_preamble = ":WAVeform:PREamble?"
waveform_data = ":WAVeform:DATA?"

