[package]
name = "instrument-runtime"
description = "Experimental protocol-neutral device registration and session runtime"
version = "0.3.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
instrument-api = { path = "../instrument-api", version = "=0.3.0-alpha.1" }

tokio = { version = "1", features = ["rt", "sync"], optional = true }

[features]
default = []
async = ["instrument-api/async", "dep:tokio"]
