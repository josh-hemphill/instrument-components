name: CI

on:
  push:
    branches: [latest]
  pull_request:
    branches: [latest]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Commit or tag to validate for a release
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  driver-sdk:
    name: Driver SDK and native package proofs
    uses: ./.github/workflows/driver-sdk.yml
    with:
      source_ref: ${{ inputs.source_ref }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --no-default-features -- -D warnings
      # instrument-visa links libvisa unconditionally; runners have no VISA.
      # It is compile-checked by the cross-compile and tokio jobs instead.
      - run: cargo test --workspace --exclude instrument-visa --no-default-features
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test-release-package.py
      - run: python tools/test-release-assets.py
      - run: python tools/test-recover-sdk-assets.py
      - run: python tools/test-root-package-metadata.py
      - run: python tools/test-packaging-metadata.py
      - run: python tools/device-extraction-index.py
      - run: python tools/test-device-extraction-extensions.py
      - run: python -m unittest discover -s tools/publisher-setup -p 'test_*.py'
      - run: node --test tools/validate-release_test.ts
      - run: node tools/gen-shared-tables.ts
      - run: rustfmt crates/instrument-core/src/classifier/probes.rs
      - run: git diff --exit-code -- crates/instrument-core/src/classifier/probes.rs dotnet/src/InstrumentComponents/Classifier/CapabilityProbes.cs
      - run: cargo doc --no-deps --workspace --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  package-core:
    name: Package instrument-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p instrument-core --dry-run --allow-dirty

  cross-compile:
    name: Cross-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p instrument-visa --features cross-compile --target x86_64-pc-windows-gnu

  tokio:
    name: Tokio feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p instrument-components --all-features
      - run: cargo check -p instrument-visa --features cross-compile,tokio
      - run: cargo clippy -p instrument-core --features async -- -D warnings
      - run: cargo test -p instrument-core --features async
      - run: cargo test -p instrument-components --all-features

  msrv:
    name: Rust 1.85 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace --all-features --locked
