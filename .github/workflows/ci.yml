name: CI

on:
  push:
    branches: [latest]
  pull_request:
    branches: [latest]
  workflow_call:
    inputs:
      source_ref:
        description: Commit or tag to validate for a release
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --no-default-features -- -D warnings
      # instrument-visa links libvisa unconditionally; runners have no VISA.
      # It is compile-checked by the cross-compile and tokio jobs instead.
      - run: cargo test --workspace --exclude instrument-visa --no-default-features
      - uses: denoland/setup-deno@v2
      - run: deno test --allow-read tools/validate-release_test.ts
      - run: deno run --allow-read --allow-write --allow-run=rustfmt tools/gen-shared-tables.ts
      - run: deno run --allow-read --allow-write --allow-run=rustfmt tools/gen-dialects.ts
      - run: rustfmt crates/instrument-core/src/classifier/probes.rs crates/instrument-core/src/scpi_commands.rs crates/instrument-core/src/dialect.rs
      - run: git diff --exit-code -- crates/instrument-core/src/classifier/probes.rs crates/instrument-core/src/scpi_commands.rs crates/instrument-core/src/dialect.rs dotnet/src/InstrumentComponents/Classifier/CapabilityProbes.cs dotnet/src/InstrumentComponents/Classes/ScpiCommands.cs dotnet/src/InstrumentComponents/Dialects/DialectRegistry.cs
      - run: cargo doc --no-deps --workspace --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  package-core:
    name: Package instrument-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p instrument-core --dry-run --allow-dirty

  cross-compile:
    name: Cross-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p instrument-visa --features cross-compile --target x86_64-pc-windows-gnu

  tokio:
    name: Tokio feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p instrument-components --features visa,tokio
      - run: cargo clippy -p instrument-core --features async -- -D warnings
      - run: cargo test -p instrument-core --features async
      - run: cargo test -p instrument-components --features tokio --no-default-features
