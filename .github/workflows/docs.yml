name: Docs

on:
  push:
    branches: [latest]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed branch, commit or tag to publish (empty uses this workflow ref)
        required: false
        default: ''
  pull_request:
    paths: ['docs-site/**', '.github/workflows/docs.yml']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt
      - name: Build site
        working-directory: docs-site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
