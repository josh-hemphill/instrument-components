# Physical evidence is collected by an explicitly selected application in a driver
# repository, after previews pass software/native gates. This is never run by CI.
name: Explicit external bench application
on:
  workflow_dispatch:
    inputs:
      application_repository:
        description: Repository containing the reviewed bench application
        required: true
        type: string
      application_ref:
        description: Immutable application commit to run
        required: true
        type: string
      bench_configuration:
        description: Reviewed committed JSON configuration under validation/bench/configs
        required: true
        type: string
      instrument_resource:
        description: Operator-selected VISA resource; no automatic discovery or driver selection
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: instrument-bench
  cancel-in-progress: false
jobs:
  bench:
    runs-on: [self-hosted, visa]
    timeout-minutes: 15
    steps:
      - name: Validate explicit application reference
        shell: python
        env:
          APP_REPOSITORY: ${{ inputs.application_repository }}
          APP_REF: ${{ inputs.application_ref }}
          BENCH_CONFIGURATION: ${{ inputs.bench_configuration }}
        run: |
          import os, re
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',os.environ['APP_REPOSITORY']):raise SystemExit('Repository owner/name required')
          if not re.fullmatch(r'validation/bench/configs/[A-Za-z0-9_-]+\.json',os.environ['BENCH_CONFIGURATION']):raise SystemExit('Reviewed configuration path required')
          if not re.fullmatch(r'[0-9a-f]{40}',os.environ['APP_REF']):raise SystemExit('Immutable 40-character commit required')
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.application_repository }}
          ref: ${{ inputs.application_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run reviewed application with its committed bench configuration
        shell: python
        env:
          INSTRUMENT_RESOURCE: ${{ inputs.instrument_resource }}
          BENCH_CONFIGURATION: ${{ inputs.bench_configuration }}
        run: |
          import os,subprocess
          subprocess.run(['dotnet','restore','validation/bench/Bench.csproj','--locked-mode'],check=True)
          subprocess.run(['dotnet','run','--project','validation/bench/Bench.csproj','-c','Release','--no-restore','--','--hardware','--config',os.environ['BENCH_CONFIGURATION'],'--record','artifacts/bench-evidence.json'],check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-bench-evidence
          path: artifacts/bench-evidence.json
          if-no-files-found: warn
