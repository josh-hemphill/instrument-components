name: .NET

on:
  push:
    branches: [latest, main, master]
  pull_request:
    branches: [latest, main, master]
  workflow_call:

env:
  DOTNET_NOLOGO: true

jobs:
  registry-drift:
    name: Shared data drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: denoland/setup-deno@v2
      - run: deno run --allow-read --allow-write dotnet/tools/gen-registry.ts
      - run: deno run --allow-read --allow-write --allow-run=rustfmt tools/gen-shared-tables.ts
      - run: deno run --allow-read --allow-write --allow-run=rustfmt tools/gen-dialects.ts
      - run: deno run --allow-read tools/validate-opentap-operations.ts
      - run: rustfmt crates/instrument-core/src/classifier/probes.rs crates/instrument-core/src/scpi_commands.rs crates/instrument-core/src/dialect.rs
      - run: git diff --exit-code -- dotnet/src/InstrumentComponents/Data/model_registry.json dotnet/src/InstrumentComponents/Classifier/CapabilityProbes.cs dotnet/src/InstrumentComponents/Classes/ScpiCommands.cs crates/instrument-core/src/classifier/probes.rs crates/instrument-core/src/scpi_commands.rs crates/instrument-core/src/dialect.rs dotnet/src/InstrumentComponents/Dialects/DialectRegistry.cs

  build-test:
    name: Build and test (mock)
    needs: registry-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore dotnet/InstrumentComponents.sln
      - run: dotnet build dotnet/InstrumentComponents.sln --no-restore -c Release
      - run: dotnet test dotnet/tests/InstrumentComponents.Tests/InstrumentComponents.Tests.csproj --no-build -c Release
      - run: dotnet test dotnet/tests/InstrumentComponents.Visa.Tests/InstrumentComponents.Visa.Tests.csproj --no-build -c Release --filter "Category!=Hardware"
      - run: dotnet test dotnet/tests/InstrumentComponents.OpenTap.Tests/InstrumentComponents.OpenTap.Tests.csproj --no-build -c Release

  build-visa-windows:
    name: Build VISA package (Windows)
    needs: registry-drift
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build dotnet/InstrumentComponents.sln -c Release
      - run: dotnet test dotnet/tests/InstrumentComponents.Visa.Tests/InstrumentComponents.Visa.Tests.csproj -c Release --filter "Category!=Hardware" --no-build

  build-visa-linux:
    name: Build VISA package (Linux)
    needs: registry-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build dotnet/src/InstrumentComponents.Visa/InstrumentComponents.Visa.csproj -c Release
      - run: dotnet run --project dotnet/examples/MockFixtureCi/MockFixtureCi.csproj -c Release
      - run: dotnet run --project dotnet/examples/MockFixtureCiAsync/MockFixtureCiAsync.csproj -c Release
