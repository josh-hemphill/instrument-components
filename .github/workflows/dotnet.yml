name: .NET

on:
  push:
    branches: [latest, main, master]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Commit or tag to validate for a release
        required: false
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true

jobs:
  registry-drift:
    name: Shared data drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node tools/gen-shared-tables.ts
      - run: node tools/validate-opentap-operations.ts
      - run: node tools/gen-opentap-steps.ts
      - run: git diff --exit-code -- spec/opentap-operations.json spec/opentap-operations.schema.json dotnet/src/InstrumentComponents.OpenTap/Steps/Generated/
      - run: rustfmt crates/instrument-core/src/classifier/probes.rs
      - run: git diff --exit-code -- dotnet/src/InstrumentComponents/Classifier/CapabilityProbes.cs crates/instrument-core/src/classifier/probes.rs

  build-test:
    name: Build and test (mock)
    needs: registry-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore dotnet/InstrumentComponents.sln
      - run: dotnet build dotnet/InstrumentComponents.sln --no-restore -c Release
      - run: dotnet test dotnet/tests/InstrumentComponents.Tests/InstrumentComponents.Tests.csproj --no-build -c Release
      - run: dotnet test dotnet/tests/InstrumentComponents.Visa.Tests/InstrumentComponents.Visa.Tests.csproj --no-build -c Release --filter "Category!=Hardware"
      - run: dotnet test dotnet/tests/InstrumentComponents.OpenTap.Tests/InstrumentComponents.OpenTap.Tests.csproj --no-build -c Release
      - run: dotnet test dotnet/tests/InstrumentComponents.OpenTap.Visa.Tests/InstrumentComponents.OpenTap.Visa.Tests.csproj --no-build -c Release --filter "Category!=Hardware"
      - run: dotnet run --project dotnet/examples/OpenTapMockPlan/OpenTapMockPlan.csproj -c Release

  net10-compatibility:
    name: .NET 10 compatibility (${{ matrix.os }})
    needs: registry-drift
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build dotnet/InstrumentComponents.sln -c Release
      - run: dotnet test dotnet/InstrumentComponents.sln -c Release --no-build --filter "Category!=Hardware"
      - run: dotnet run --project dotnet/examples/OpenTapMockPlan/OpenTapMockPlan.csproj -c Release
      - name: Pack exact facade prerequisites into the clean development feed
        shell: pwsh
        run: |
          foreach ($name in @('InstrumentComponents.Abstractions','InstrumentComponents.Runtime')) {
            dotnet pack "dotnet/src/$name/$name.csproj" -c Release --no-build -o "${{ runner.temp }}/net10-packages"
            if ($LASTEXITCODE -ne 0) { throw "Pack failed: $name" }
          }
      - run: dotnet pack dotnet/src/InstrumentComponents/InstrumentComponents.csproj -c Release --no-build -o "${{ runner.temp }}/net10-packages"
      - run: dotnet pack dotnet/src/InstrumentComponents.Visa/InstrumentComponents.Visa.csproj -c Release --no-build -o "${{ runner.temp }}/net10-packages"
      - run: dotnet restore dotnet/examples/PackageConsumerSmoke/PackageConsumerSmoke.csproj --configfile dotnet/tools/package-consumer.NuGet.Config --packages "${{ runner.temp }}/net10-consumer-cache"
        env:
          INSTRUMENT_COMPONENTS_PACKAGE_FEED: ${{ runner.temp }}/net10-packages
      - run: dotnet run --project dotnet/examples/PackageConsumerSmoke/PackageConsumerSmoke.csproj -c Release --no-restore

  tappackage:
    name: OpenTAP package (net${{ matrix.sdk }})
    needs: registry-drift
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['9.0', '10.0']
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            ${{ matrix.sdk }}.x
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: dotnet build dotnet/src/InstrumentComponents.OpenTap/InstrumentComponents.OpenTap.csproj -c Release -p:CreateOpenTapPackage=true
      - run: node tools/verify-opentap-package.ts
      - name: Install smoke
        working-directory: dotnet/src/InstrumentComponents.OpenTap/bin/Release/net8.0
        run: |
          ./tap package list -i | grep InstrumentComponents.OpenTap
          ./tap package uninstall InstrumentComponents.OpenTap -f
          packages=(InstrumentComponents.OpenTap.*.TapPackage)
          test "${#packages[@]}" -eq 1
          ./tap package install "${packages[0]}"
          ./tap package verify InstrumentComponents.OpenTap
          ./tap package show InstrumentComponents.OpenTap
          ./tap package list -i | grep InstrumentComponents.OpenTap

  build-visa-windows:
    name: Build VISA package (Windows)
    needs: registry-drift
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build dotnet/InstrumentComponents.sln -c Release
      - run: dotnet test dotnet/tests/InstrumentComponents.Visa.Tests/InstrumentComponents.Visa.Tests.csproj -c Release --filter "Category!=Hardware" --no-build
      - run: dotnet test dotnet/tests/InstrumentComponents.OpenTap.Visa.Tests/InstrumentComponents.OpenTap.Visa.Tests.csproj -c Release --filter "Category!=Hardware" --no-build

  build-visa-linux:
    name: Build VISA package (Linux)
    needs: registry-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build dotnet/src/InstrumentComponents.Visa/InstrumentComponents.Visa.csproj -c Release
      - run: dotnet run --project dotnet/examples/MockFixtureCi/MockFixtureCi.csproj -c Release
      - run: dotnet run --project dotnet/examples/MockFixtureCiAsync/MockFixtureCiAsync.csproj -c Release
