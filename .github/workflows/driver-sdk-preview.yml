name: Driver SDK preview release
on:
  push:
    tags: ['driver-sdk-v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        env:
          SDK_TAG: ${{ github.ref_name }}
        run: |
          version=$(python tools/validate-sdk-release.py --tag "$SDK_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
  conformance:
    needs: validate
    uses: ./.github/workflows/driver-sdk.yml
    with:
      source_ref: ${{ github.ref }}
  crates:
    env:
      CARGO_BOOTSTRAP_TOKEN: ${{ secrets.CARGO_BOOTSTRAP_TOKEN }}
    needs: [validate, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        if: env.CARGO_BOOTSTRAP_TOKEN == ''
        id: auth
      - name: Publish contracts, runtime, SCPI and development TestKit
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: |
          python tools/release-package.py --crate instrument-api
          python tools/release-package.py --crate instrument-runtime
          python tools/release-package.py --crate instrument-scpi
          python tools/release-package.py --crate instrument-testkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-crates
          path: publication-proof/*
          if-no-files-found: warn
  nuget:
    needs: [validate, conformance]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack only the new SDK packages
        shell: pwsh
        run: |
          foreach ($name in @('InstrumentComponents.Abstractions','InstrumentComponents.Runtime','InstrumentComponents.Scpi','InstrumentComponents.TestKit')) {
            dotnet pack "dotnet/src/$name/$name.csproj" -c Release -o packages
            if ($LASTEXITCODE -ne 0) { throw "Pack failed: $name" }
          }
      - uses: NuGet/login@v1
        id: auth
        with:
          user: josh-hemphill
      - name: Publish previews
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.auth.outputs.NUGET_API_KEY }}
        run: |
          $packages = @('InstrumentComponents.Abstractions','InstrumentComponents.Runtime','InstrumentComponents.Scpi','InstrumentComponents.TestKit') | ForEach-Object { Get-Item "packages/$($_).${{ needs.validate.outputs.version }}.nupkg" }
          if ($packages.Count -ne 4) { throw 'Expected exactly four SDK packages' }
          foreach ($package in $packages) {
            python tools/release-package.py --nuget $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $($package.Name)" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-nuget
          path: publication-proof/*
          if-no-files-found: warn
  tool-assets:
    needs: [validate, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: python -m pip wheel --no-deps --wheel-dir assets ./tools/driver-tools
      - run: cd assets && sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-tool-assets
          path: assets/*
  release:
    needs: [crates, nuget, tool-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdk-tool-assets
          path: assets
      - name: Publish immutable SDK release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release-assets.py --tag "$RELEASE_TAG" --assets assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-release-assets
          path: release-assets-proof.json
