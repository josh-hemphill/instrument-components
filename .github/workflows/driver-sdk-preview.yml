name: Driver SDK preview release
on:
  push:
    tags: ['driver-sdk-v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        env:
          SDK_TAG: ${{ github.ref_name }}
        run: |
          version=$(python tools/validate-sdk-release.py --tag "$SDK_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
  conformance:
    needs: validate
    uses: ./.github/workflows/driver-sdk.yml
    with:
      source_ref: ${{ github.ref }}
  crates:
    env:
      CARGO_BOOTSTRAP_TOKEN: ${{ secrets.CARGO_BOOTSTRAP_TOKEN }}
    needs: [validate, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        if: env.CARGO_BOOTSTRAP_TOKEN == ''
        id: auth
      - name: Publish contracts, runtime, SCPI and development TestKit
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: |
          cargo publish --locked -p instrument-api
          cargo publish --locked -p instrument-runtime
          cargo publish --locked -p instrument-scpi
          cargo publish --locked -p instrument-testkit
  nuget:
    needs: [validate, conformance]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack only the new SDK packages
        shell: pwsh
        run: |
          foreach ($name in @('InstrumentComponents.Abstractions','InstrumentComponents.Runtime','InstrumentComponents.Scpi','InstrumentComponents.TestKit')) {
            dotnet pack "dotnet/src/$name/$name.csproj" -c Release -o packages
            if ($LASTEXITCODE -ne 0) { throw "Pack failed: $name" }
          }
      - uses: NuGet/login@v1
        id: auth
        with:
          user: josh-hemphill
      - name: Publish previews
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.auth.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem packages -Filter *.nupkg)
          if ($packages.Count -ne 4) { throw 'Expected exactly four SDK packages' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $($package.Name)" }
          }
  tool-assets:
    needs: [validate, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps --wheel-dir assets ./tools/driver-tools
      - run: sha256sum assets/*.whl > assets/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-tool-assets
          path: assets/*
  release:
    needs: [crates, nuget, tool-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-tool-assets
          path: assets
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: 'Driver SDK preview. Synthetic conformance and native Windows/Linux package gates passed. Hardware validation and full device-package cutover remain pending.'
          files: assets/*
          fail_on_unmatched_files: true
