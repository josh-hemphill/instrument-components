name: Preview cleanliness guard probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4105d6659ad46b163ca9f252cc250b01fc5e0ba8
          path: payload
      - uses: actions/checkout@v4
        with:
          ref: f9ec63cc0b144d29e3650438dd55c2994c142f42
          path: preview-helper
          sparse-checkout: |
            .gitignore
            tools/validate-public-preview.py
            tools/qualification_logs.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise actual guard and staging without compiler or registry calls
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import json,os,pathlib,runpy,subprocess,sys
          from unittest.mock import patch
          payload=pathlib.Path('payload').resolve();helper=pathlib.Path('preview-helper').resolve()
          sys.path.insert(0,str(helper/'tools'))
          namespace=runpy.run_path(str(helper/'tools/validate-public-preview.py'));main=namespace['main']
          class ReachedCommand(Exception):pass
          def stop(*args,**kwargs):raise ReachedCommand()
          main.__globals__['execute_logged']=stop
          results=[]
          for baseline in [False,True]:
              output=pathlib.Path(os.environ['RUNNER_TEMP'])/('baseline' if baseline else 'current')
              args=['preview','--source-root',str(payload),'--output',str(output)]+(['--baseline'] if baseline else [])
              with patch.object(sys,'argv',args):
                  try:main()
                  except ReachedCommand:results.append(dict(baseline=baseline,reachedFirstCommand=True))
                  else:raise AssertionError('Did not reach command staging')
          probe=payload/'guard-unignored-probe.txt';probe.write_text('synthetic guard test')
          with patch.object(sys,'argv',['preview','--source-root',str(payload),'--output',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'negative')]):
              try:main()
              except ValueError as error:
                  if probe.name not in str(error):raise
                  results.append(dict(unignoredEditRejected=True))
              else:raise AssertionError('Dirty payload accepted')
          print(json.dumps(dict(scope='Windows guard/staging only; no package execution or hardware claim',results=results),indent=2))
