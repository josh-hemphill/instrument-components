name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume with exact immutable package identity checks
        required: true
        type: string
      source_ref:
        description: Optional source ref; must resolve to the exact existing release tag commit
        required: false
        type: string
      recover_sdk_assets_from_run:
        description: Recover only SDK assets from an existing qualified producer run; no registry publication
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: inputs.recover_sdk_assets_from_run == ''
    name: Validate release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
      - name: Require exact immutable tag source on retries
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the exact SDK preview on public registries
        run: python tools/validate-public-sdk.py
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node tools/validate-release.ts "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_commit }}

  dotnet:
    name: .NET gate
    needs: validate
    uses: ./.github/workflows/dotnet.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_commit }}

  publish:
    name: Publish to crates.io
    needs: [validate, ci, dotnet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - run: python tools/release-package.py --crate instrument-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - run: python tools/release-package.py --crate instrument-visa
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - run: python tools/release-package.py --crate instrument-components
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-crates
          path: publication-proof/*
          if-no-files-found: warn

  nuget:
    name: Publish to NuGet
    needs: [validate, ci, dotnet]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet pack dotnet/src/InstrumentComponents/InstrumentComponents.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - run: dotnet pack dotnet/src/InstrumentComponents.Visa/InstrumentComponents.Visa.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - run: dotnet pack dotnet/src/InstrumentComponents.OpenTap/InstrumentComponents.OpenTap.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - run: dotnet pack dotnet/src/InstrumentComponents.OpenTap.Visa/InstrumentComponents.OpenTap.Visa.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: nuget-auth
        with:
          user: josh-hemphill
      - name: Push NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-auth.outputs.NUGET_API_KEY }}
        run: |
          $packages = @('InstrumentComponents','InstrumentComponents.Visa','InstrumentComponents.OpenTap','InstrumentComponents.OpenTap.Visa') | ForEach-Object { Get-Item "nupkg/$($_).${{ needs.validate.outputs.version }}.nupkg" }
          if ($packages.Count -ne 4) { throw "Expected four NuGet packages, found $($packages.Count)" }
          foreach ($package in $packages) {
            python tools/release-package.py --nuget $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $($package.Name)" }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-nuget
          path: publication-proof/*
          if-no-files-found: warn

  tap-package:
    name: Build OpenTAP release artifact
    needs: [validate, ci, dotnet]
    runs-on: ubuntu-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet build dotnet/src/InstrumentComponents.OpenTap/InstrumentComponents.OpenTap.csproj -c Release -p:CreateOpenTapPackage=true
      - run: node tools/verify-opentap-package.ts "${{ needs.validate.outputs.version }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute the exact release TapPackage after installation
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/opentap-release
        run: |
          packages=(dotnet/src/InstrumentComponents.OpenTap/bin/Release/net8.0/*.TapPackage)
          test "${#packages[@]}" -eq 1
          python tools/validate-opentap-release.py --package "${packages[0]}" --runtime dotnet/src/InstrumentComponents.OpenTap/bin/Release/net8.0 --output "$PROOF_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opentap-release-proof
          path: |
            ${{ runner.temp }}/opentap-release/*.json
            ${{ runner.temp }}/opentap-release/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: opentap-package
          path: dotnet/src/InstrumentComponents.OpenTap/bin/Release/net8.0/*.TapPackage
          if-no-files-found: error

  public-root:
    name: Public root packages (${{ matrix.os }}, ${{ matrix.framework }})
    needs: [validate, publish, nuget]
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: driver-sdk-${{ matrix.os }}-${{ matrix.framework }}
          path: ${{ runner.temp }}/root-sdk-artifact
      - run: python -m pip install ./tools/driver-tools
      - name: Execute fresh public root package consumers
        shell: python
        env:
          PROOF_FRAMEWORK: ${{ matrix.framework }}
        run: |
          import os,pathlib,subprocess,sys
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          subprocess.run([sys.executable,'tools/validate-root-packages.py','--sdk-proof',str(temp/'root-sdk-artifact'),'--output',str(temp/'public-root'),'--framework',os.environ['PROOF_FRAMEWORK'],'--public-registry'],check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-root-${{ matrix.os }}-${{ matrix.framework }}
          path: |
            ${{ runner.temp }}/public-root/*.json
            ${{ runner.temp }}/public-root/*.log
            ${{ runner.temp }}/public-root/consumer-inputs/**
            ${{ runner.temp }}/public-root/consumer-artifacts/**

  github-release:
    if: >-
      always() && needs.nuget.result == 'success' && needs.tap-package.result == 'success' && needs.public-root.result == 'success' &&
      needs.publish.result == 'success'
    name: GitHub Release
    needs: [validate, publish, nuget, tap-package, public-root]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: opentap-package
          path: release-artifacts
      - name: Publish immutable OpenTAP release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python tools/release-assets.py --tag "$RELEASE_TAG" --assets release-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-release-assets
          path: release-assets-proof.json

  recover-sdk-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_sdk_assets_from_run != ''
    name: Recover immutable SDK release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify producer, source, original artifact and immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.tag }}
          RECOVERY_RUN: ${{ inputs.recover_sdk_assets_from_run }}
          RECOVERY_SOURCE: ${{ inputs.source_ref }}
          RECOVERY_OUTPUT: ${{ runner.temp }}/sdk-asset-recovery
        run: python tools/recover-sdk-assets.py --tag "$RECOVERY_TAG" --producer-run-id "$RECOVERY_RUN" --source "$RECOVERY_SOURCE" --output "$RECOVERY_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-asset-recovery
          path: |
            ${{ runner.temp }}/sdk-asset-recovery/*.json
            ${{ runner.temp }}/sdk-asset-recovery/*.zip
            ${{ runner.temp }}/sdk-asset-recovery/*.log
            ${{ runner.temp }}/sdk-asset-recovery/assets/*
