name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(deno run --allow-read tools/validate-release.ts "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  dotnet:
    name: .NET gate
    uses: ./.github/workflows/dotnet.yml

  publish:
    name: Publish to crates.io
    needs: [validate, ci, dotnet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - run: cargo publish -p instrument-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - run: cargo publish -p instrument-visa
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - run: cargo publish -p instrument-components
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  nuget:
    name: Publish to NuGet
    needs: [validate, ci, dotnet]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - run: deno run --allow-read --allow-write dotnet/tools/gen-registry.ts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet pack dotnet/src/InstrumentComponents/InstrumentComponents.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - run: dotnet pack dotnet/src/InstrumentComponents.Visa/InstrumentComponents.Visa.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: nuget-auth
        with:
          user: josh-hemphill
      - run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.nuget-auth.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    name: GitHub Release
    needs: [publish, nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
