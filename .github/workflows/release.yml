name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry NuGet and OpenTAP artifacts (crates.io is skipped)
        required: true
        type: string
      source_ref:
        description: Optional commit for a packaging-only backfill; defaults to the release tag
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
      - uses: denoland/setup-deno@v2
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(deno run --allow-read tools/validate-release.ts "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.source_ref || inputs.tag || github.ref }}

  dotnet:
    name: .NET gate
    uses: ./.github/workflows/dotnet.yml
    with:
      source_ref: ${{ inputs.source_ref || inputs.tag || github.ref }}

  publish:
    if: github.event_name == 'push'
    name: Publish to crates.io
    needs: [validate, ci, dotnet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - run: cargo publish -p instrument-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - run: cargo publish -p instrument-visa
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - run: cargo publish -p instrument-components
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  nuget:
    name: Publish to NuGet
    needs: [validate, ci, dotnet]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
      - uses: denoland/setup-deno@v2
      - run: deno run --allow-read --allow-write dotnet/tools/gen-registry.ts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet pack dotnet/src/InstrumentComponents/InstrumentComponents.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - run: dotnet pack dotnet/src/InstrumentComponents.Visa/InstrumentComponents.Visa.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - run: dotnet pack dotnet/src/InstrumentComponents.OpenTap/InstrumentComponents.OpenTap.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - run: dotnet pack dotnet/src/InstrumentComponents.OpenTap.Visa/InstrumentComponents.OpenTap.Visa.csproj -c Release -o nupkg -p:Version=${{ needs.validate.outputs.version }}
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: nuget-auth
        with:
          user: josh-hemphill
      - name: Push NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-auth.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -Path nupkg -Filter *.nupkg | Sort-Object Name)
          if ($packages.Count -ne 4) { throw "Expected four NuGet packages, found $($packages.Count)" }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $($package.Name)" }
          }

  tap-package:
    name: Build OpenTAP release artifact
    needs: [validate, ci, dotnet]
    runs-on: ubuntu-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: deno run --allow-read --allow-write dotnet/tools/gen-registry.ts
      - run: dotnet build dotnet/src/InstrumentComponents.OpenTap/InstrumentComponents.OpenTap.csproj -c Release -p:CreateOpenTapPackage=true
      - run: deno run --allow-read --allow-run=unzip tools/verify-opentap-package.ts "${{ needs.validate.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: opentap-package
          path: dotnet/src/InstrumentComponents.OpenTap/bin/Release/net8.0/*.TapPackage
          if-no-files-found: error

  github-release:
    if: >-
      always() && needs.nuget.result == 'success' && needs.tap-package.result == 'success' &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped'))
    name: GitHub Release
    needs: [publish, nuget, tap-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: opentap-package
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*.TapPackage
          fail_on_unmatched_files: true
