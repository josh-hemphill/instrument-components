site_name: instrument-components
site_description: High-level Rust and C# control for VISA / SCPI instruments
site_url: https://josh-hemphill.github.io/instrument-components/
repo_url: https://github.com/josh-hemphill/instrument-components
repo_name: josh-hemphill/instrument-components
edit_uri: edit/latest/docs-site/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.expand
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Discovery: discovery.md
  - Capability matrix: capability-matrix.md
  - Instrument classes:
      - DMM: classes/dmm.md
      - DC power supply: classes/dc-power-supply.md
      - Function generator: classes/function-generator.md
      - Oscilloscope: classes/oscilloscope.md
      - Switch: classes/switch.md
      - Counter: classes/counter.md
      - Power meter: classes/power-meter.md
      - Spectrum analyzer: classes/spectrum-analyzer.md
  - Rust:
      - Async: rust/async.md
      - Errors: rust/errors.md
      - VISA: rust/visa.md
  - C#:
      - Async: csharp/async.md
      - Errors: csharp/errors.md
      - OpenTAP: csharp/opentap.md
      - VISA: csharp/visa.md
